schema_version: 1

context:
  name: anybadge
  version: "1.18.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/anybadge-${{ version }}.tar.gz
  sha256: 1f275a1aa14a8d04d1043b420550504eb72d44d222fea78e2a6a0347f8a2e6e3

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - anybadge=anybadge.cli:main
      - anybadge-server=anybadge.server.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61
    - setuptools-scm >=7
    - wheel
  run:
    - packaging
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - anybadge
        - anybadge_server
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - anybadge --help
      - anybadge-server --help

about:
  summary: Simple, flexible badge generator for project badges.
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/jongracecox/anybadge

extra:
  recipe-maintainers:
    - thewchan
